name: Sync Shadowrocket modules

on:
  push:
    branches: [master]
    paths:
      - config/modules.json
      - scripts/convert.py
      - tests/**
      - .github/workflows/sync.yml
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowrocket-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Convert modules
        run: python scripts/convert.py
      - name: Commit generated changes
        run: |
          if [[ -n "$(git status --porcelain -- README.md modules/)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- README.md modules/
            git commit -m 'chore: sync proxied Shadowrocket modules'
            git push
          else
            echo 'Modules are already up to date.'
          fi
